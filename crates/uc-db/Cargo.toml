[package]
name = "uc-db"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = ["s3"]
# The real ObjectLog. Off only for builds that supply their own (tests use
# store::memory::MemoryLog) and want no AWS SDK.
s3 = ["dep:aws-sdk-s3"]

[dependencies]
uc-errors = { path = "../uc-errors" }
tokio = { workspace = true }
async-trait = { workspace = true }
aws-sdk-s3 = { workspace = true, optional = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
