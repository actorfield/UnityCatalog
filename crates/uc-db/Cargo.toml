[package]
name = "uc-db"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = ["sqlite"]
# `sql` is what actually pulls sqlx in. Both SQL backends imply it; `logstore`
# does not, so a log-store build links no database driver at all.
sql = ["dep:sqlx"]
sqlite = ["sql", "sqlx/sqlite"]
postgres = ["sql", "sqlx/postgres"]
# Swaps AnyPool from a sqlx pool to the log-structured Store, and selects the
# `*_store.rs` repo bodies over the SQL ones. Off by default: the SQL path stays
# the shipping path until the port is complete.
logstore = []
# The real ObjectLog. Separate from `logstore` so the store and its tests build
# without pulling in the AWS SDK.
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]

[dependencies]
uc-errors = { path = "../uc-errors" }
uc-types = { path = "../uc-types" }
uc-openapi = { path = "../uc-openapi" }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true }
async-trait = { workspace = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
uuid = { workspace = true }
