[package]
name = "uc-db"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
# Swaps AnyPool from a sqlx pool to the log-structured Store, and selects the
# `*_store.rs` repo bodies over the SQL ones. Off by default: the SQL path stays
# the shipping path until the port is complete.
logstore = []

[dependencies]
uc-errors = { path = "../uc-errors" }
uc-types = { path = "../uc-types" }
uc-openapi = { path = "../uc-openapi" }
sqlx = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
uuid = { workspace = true }
